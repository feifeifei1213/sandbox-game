app:
  name: sandbox-game
  version: 0.1.0

server:
  host: 0.0.0.0
  port: 8080
  mode: release
  readTimeoutSeconds: 10
  writeTimeoutSeconds: 10

log:
  level: info

mysql:
  dsn: root:root@tcp(127.0.0.1:3306)/sandbox_game?charset=utf8mb4&parseTime=True&loc=Local
  maxOpenConns: 20
  maxIdleConns: 10

auth:
  mode: local
