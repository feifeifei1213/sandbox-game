app:
  name: sandbox-game
  version: 0.1.0

server:
  host: 0.0.0.0
  port: 8080
  mode: debug
  readTimeoutSeconds: 10
  writeTimeoutSeconds: 10

frontend:
  distDir: frontend/dist

log:
  level: debug

mysql:
  dsn: root:123456@tcp(127.0.0.1:3306)/sandbox_game_single_rehearsal?charset=utf8mb4&parseTime=True&loc=Local
  maxOpenConns: 10
  maxIdleConns: 5

auth:
  mode: local
  tokenSecret: sandbox-game-local-secret
  tokenExpireSeconds: 28800
