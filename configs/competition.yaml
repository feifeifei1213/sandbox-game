app:
  name: sandbox-game-service
  version: 0.1.0

server:
  host: 0.0.0.0
  port: 8080
  mode: release
  readTimeoutSeconds: 15
  writeTimeoutSeconds: 15

log:
  level: info

mysql:
  dsn: root:CHANGE_ME@tcp(127.0.0.1:3306)/sandbox_game_service_competition?charset=utf8mb4&parseTime=True&loc=Local
  maxOpenConns: 20
  maxIdleConns: 10

auth:
  mode: local
  tokenSecret: CHANGE_ME_TO_A_RANDOM_SECRET
  tokenExpireSeconds: 28800
